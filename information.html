<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Información | Cumpleaños de Ale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-info">

    <main class="contenido-info">


        <!-- ================================= -->
        <!-- INFORMACIÓN -->
        <!-- ================================= -->

        <section class="seccion-info-principal">

            <img
                src="assets/images/info1.png"
                alt="Información del cumpleaños de Ale"
                class="imagen-informacion"
            >

        </section>


        <!-- ================================= -->
        <!-- UBICACIÓN -->
        <!-- ================================= -->

        <section class="seccion-ubicacion">

            <div class="ubicacion-contenido">


                <!-- MAPA -->

                <div class="ubicacion-mapa">

                    <p class="ubicacion-titulo">
                        UBICACIÓN
                    </p>

                    <h2>
                        Ajuá
                    </h2>

                    <p class="ubicacion-direccion">
                        Alajuela, Costa Rica
                    </p>


                    <div class="mapa">

                        <iframe
                            src="https://www.google.com/maps?q=Ajuá%20Alajuela%20Costa%20Rica&output=embed"
                            loading="lazy"
                            title="Ubicación de Ajuá"
                        ></iframe>

                    </div>


                    <a
                        href="https://www.google.com/maps/search/Ajuá+Alajuela+Costa+Rica"
                        target="_blank"
                        rel="noreferrer"
                        class="boton-mapa"
                    >
                        <span>
                            VER EN GOOGLE MAPS
                        </span>

                        <span>
                            →
                        </span>
                    </a>

                </div>


                <!-- VIDEO -->

                <div class="video-contenedor">

                    <div class="cinta-video"></div>

                    <video
                        class="video-mama"
                        autoplay
                        muted
                        loop
                        playsinline
                    >
                        <source
                            src="mama.mp4"
                            type="video/mp4"
                        >

                        Tu navegador no puede reproducir el video.
                    </video>

                </div>

            </div>

        </section>

        <!-- ================================= -->
<!-- FOOTER -->
<!-- ================================= -->

<footer class="footer-info">

    <p>
        Cada invitado cubre su consumo ♡
    </p>

</footer>

    </main>

</body>

</html>
