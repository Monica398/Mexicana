<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Información | Cumpleaños de Ale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-info">

    <main class="contenido-info">

        <!-- ============================= -->
        <!-- PRIMERA SECCIÓN: INFORMACIÓN -->
        <!-- ============================= -->

        <section class="seccion-info-principal">

            <img
                src="assets/images/info1.png"
                alt="Información del cumpleaños de Ale"
                class="imagen-informacion"
            >

        </section>


        <!-- ============================= -->
        <!-- AQUÍ HAREMOS LA UBICACIÓN -->
        <!-- ============================= -->

        <section class="seccion-ubicacion">

    <div class="ubicacion-contenido">

        <!-- COLUMNA IZQUIERDA -->
        <div class="ubicacion-mapa">

            <p class="ubicacion-titulo">
                UBICACIÓN
            </p>

            <h2>
                Ajuá
            </h2>

            <p class="ubicacion-direccion">
                Alajuela, Costa Rica
            </p>

            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps?q=Ajuá%20Alajuela%20Costa%20Rica&output=embed"
                    loading="lazy"
                    title="Ubicación de Ajuá"
                ></iframe>
            </div>

            <a
                href="https://www.google.com/maps/search/Ajuá+Alajuela+Costa+Rica"
                target="_blank"
                rel="noreferrer"
                class="boton-mapa"
            >
                <span>VER EN GOOGLE MAPS</span>
                <span>→</span>
            </a>

        </div>


        <!-- COLUMNA DERECHA -->
        <div class="foto-ubicacion">

            <div class="cinta-foto"></div>

            <img
                src="mama.jpg"
                alt="Ale celebrando su cumpleaños"
                class="foto-mama"
            >

            <div class="nota-foto">
                Una mujer increíble<br>
                merece un día increíble ♡
            </div>

        </div>

    </div>

</section>

    </main>

</body>

</html>
